name: Release

# Publish to PyPI when a version tag is pushed, e.g.:
#   git tag v0.2.3 && git push origin v0.2.3
#
# Uses PyPI Trusted Publishing (OIDC) — no API token is stored anywhere.
# One-time setup on PyPI: project → Settings → Publishing → add a trusted
# publisher for repo Agent-ROI/agent-roi, workflow release.yml, environment pypi.

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Build web UI into the package
        run: ./scripts/build_web.sh

      - name: Verify tag matches package version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(uv run python -c 'import tomllib,pathlib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')"
          echo "tag=$TAG package=$PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag v$TAG does not match pyproject version $PKG"
            exit 1
          fi

      # --wheel (not plain `uv build`): the web UI bundle is gitignored, so the
      # sdist->wheel path drops it. Building the wheel directly bundles it.
      - name: Build wheel
        run: uv build --wheel

      - name: Verify the wheel bundles the web UI
        run: |
          unzip -l dist/*.whl | grep -q "agent_roi/webui/index.html" \
            || { echo "::error::wheel is missing the web UI"; exit 1; }

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # required for Trusted Publishing (OIDC)
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # required to create a GitHub Release
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      # The tag is "v0.3.1" but PyPI/pip want the bare "0.3.1".
      - name: Resolve version
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # Attach the built wheel/sdist; auto-generate notes from merged PRs.
          files: dist/*
          generate_release_notes: true
          body: |
            Install or upgrade:

            ```bash
            pipx install --force agent-roi==${{ steps.ver.outputs.version }}
            # or
            uv tool install agent-roi==${{ steps.ver.outputs.version }}
            ```

            PyPI: https://pypi.org/project/agent-roi/${{ steps.ver.outputs.version }}/
