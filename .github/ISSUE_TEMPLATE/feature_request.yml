name: ✨ Feature request
description: Suggest an idea or a new tool integration
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this solve? Which AI tool or workflow is involved?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What would you like to happen?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any alternative approaches you've thought about.
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: |
        Anything else — links, screenshots, or (for a new collector) where the
        tool stores its logs and what token/usage data they contain.
