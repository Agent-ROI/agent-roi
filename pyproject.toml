[project]
name = "agent-roi-tracker"
version = "0.1.0"
description = "Track the cost, usage, and ROI of your AI coding agents across every tool."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Agent-ROI contributors" }]
keywords = ["ai", "tokens", "cost", "roi", "llm", "claude", "codex", "observability"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    "httpx>=0.27",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "tomli>=2.0; python_version < '3.11'",
    "platformdirs>=4.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
agent-roi = "agent_roi.cli.main:app"

[project.urls]
Homepage = "https://github.com/Agent-ROI/agent-roi"
Repository = "https://github.com/Agent-ROI/agent-roi"
Issues = "https://github.com/Agent-ROI/agent-roi/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_roi"]
# The built web UI (src/agent_roi/webui, produced by scripts/build_web.sh) lives
# inside the package dir, but is gitignored — list it as an artifact so the build
# backend includes it in the wheel anyway.
artifacts = ["src/agent_roi/webui"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = "tomli"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
