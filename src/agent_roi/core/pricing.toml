# Agent-ROI pricing table
#
# Each [["model-name"]] block is one price epoch (array-of-tables).
# When a model's price changes, add a NEW [["model-name"]] block with "from"
# set to the date the new price took effect — do NOT edit the old block.
# This lets Agent-ROI recompute historical cost correctly.
#
# Rules:
#   - "from" is the first day the price was active (inclusive), ISO-8601 date.
#   - The earliest epoch for a model may omit "from" (treated as 1970-01-01).
#   - All prices are USD per 1,000,000 tokens.
#   - Prefix matching is used for unknown variants (e.g. "claude-sonnet-4-6-20251231"
#     resolves to "claude-sonnet-4-6"). Longest match wins.
#   - Unknown models fall back to $0 so usage is still tracked.
#
# Sources (verify at providers' official pricing pages before editing):
#   Anthropic : https://www.anthropic.com/pricing
#   OpenAI    : https://openai.com/api/pricing/
#   Google    : https://ai.google.dev/pricing

# ── Anthropic ─────────────────────────────────────────────────────────────────
#
# The same Claude model is reachable from several tools (Claude Code, Copilot,
# Codex, Gemini CLI). Tools report it slightly differently, e.g. Copilot sends
# "copilot/claude-opus-4.6" which the collector normalizes to "claude-opus-4-6".
# So every Opus/Sonnet/Haiku point release a user might hit needs a row here;
# missing ones fall back to $0. Opus 4.x releases share the same list price.

[["claude-opus-4-8"]]
from         = "2025-05-22"
input        = 15.0
output       = 75.0
cache_read   = 1.5
cache_write  = 18.75

