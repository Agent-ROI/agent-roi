# ── Google Gemini ─────────────────────────────────────────────────────────────

# Gemini 3 Pro is size-tiered: prompts over 200k input tokens cost more
# (input $2 -> $4, output $12 -> $18, cache read $0.20 -> $0.40).
[["gemini-3-pro"]]
from  = "2025-06-01"
tiers = [
    { up_to = 200000, input = 2.0, output = 12.0, cache_read = 0.2 },
    { input = 4.0, output = 18.0, cache_read = 0.4 },  # > 200k input tokens
]

[["gemini-3-flash"]]
from         = "2025-06-01"
input        = 0.3
output       = 2.5
cache_read   = 0.03

# Gemini 2.5 Pro is size-tiered: prompts over 200k input tokens cost more.
[["gemini-2.5-pro"]]
from  = "2025-03-25"
tiers = [
    { up_to = 200000, input = 1.25, output = 10.0, cache_read = 0.125 },
    { input = 2.50, output = 15.0, cache_read = 0.25 },  # > 200k input tokens
]

